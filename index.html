<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>CoachTennisIA · Demo táctico (móvil)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { -webkit-tap-highlight-color: transparent; }
      .safe { padding-bottom: constant(safe-area-inset-bottom); padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body class="bg-gray-100">
   <a href="https://rodrimu-coder.github.io/CoachMental/" target="_blank">
  <button style="
    background-color:#2563eb;
    color:white;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
  "
  onmouseover="this.style.backgroundColor='#1d4ed8'"
  onmouseout="this.style.backgroundColor='#2563eb'">
    🌿 Ir a CoachMental
  </button>
</a>
    <div id="root"></div>

    <!-- Código sin `export default` y con Babel preset react -->
    <script type="text/babel" data-presets="react">
      const { useMemo, useState, useEffect } = React;

      const SURFACES = ["Arcilla", "Dura", "Césped"];
      const STYLES = ["Agresivo de fondo", "Contragolpeador", "Todo-terreno", "Saque y volea"];
      const HANDS = ["Diestro", "Zurdo"];
      const STRENGTHS = ["Derecha", "Revés", "Saque", "Volea", "Físico", "Topspin"];
      const WEAKNESSES = ["Revés","Derecha","Movimiento","Juego en la red","Segundo saque","Altas (topspin)","Bajas (slice)"];

      const Tag = ({ children }) => (
        <span className="inline-block rounded-full border px-2 py-0.5 text-xs text-gray-700">{children}</span>
      );

      const Section = ({ title, children }) => (
        <div className="rounded-2xl border bg-white p-4 shadow-sm">
          <h2 className="mb-3 text-lg font-semibold">{title}</h2>
          {children}
        </div>
      );

      const MultiCheck = ({ options, values, onChange }) => (
        <div className="flex flex-wrap gap-2">
          {options.map((opt) => {
            const checked = values.includes(opt);
            return (
              <label key={opt} className={`cursor-pointer select-none rounded-xl border px-3 py-2 text-sm active:scale-[0.99] ${checked ? "bg-gray-900 text-white" : "bg-white"}`}>
                <input
                  type="checkbox"
                  className="mr-2 align-middle"
                  checked={checked}
                  onChange={(e) => {
                    if (e.target.checked) onChange([...values, opt]);
                    else onChange(values.filter((v) => v !== opt));
                    if (navigator.vibrate) navigator.vibrate(10);
                  }}
                />
                {opt}
              </label>
            );
          })}
        </div>
      );

      const Select = ({ label, value, setValue, options }) => (
        <label className="flex flex-col gap-1 text-sm">
          <span className="text-gray-600">{label}</span>
          <select
            className="rounded-xl border px-3 py-3"
            value={value}
            onChange={(e) => { setValue(e.target.value); if (navigator.vibrate) navigator.vibrate(10);}}
          >
            {options.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        </label>
      );

      function CoachTennisIADemo() {
        const [myHand, setMyHand] = useState("Diestro");
        const [myStyle, setMyStyle] = useState("Agresivo de fondo");
        const [myStrengths, setMyStrengths] = useState(["Derecha", "Topspin"]);

        const [oppHand, setOppHand] = useState("Zurdo");
        const [oppStyle, setOppStyle] = useState("Contragolpeador");
        const [oppWeak, setOppWeak] = useState(["Revés", "Segundo saque"]);

        const [surface, setSurface] = useState("Arcilla");

        const [obs, setObs] = useState({ missBH: 0, weak2nd: 0, hatesNet: 0, strugglesHigh: 0, slowMove: 0 });

        const bump = (k) => setObs((s) => { const v = { ...s, [k]: s[k] + 1 }; if (navigator.vibrate) navigator.vibrate(10); return v; });
        const resetObs = () => setObs({ missBH: 0, weak2nd: 0, hatesNet: 0, strugglesHigh: 0, slowMove: 0 });

        useEffect(() => {
          const saved = localStorage.getItem("coach-tennis-ia");
          if (saved) {
            try {
              const s = JSON.parse(saved);
              setMyHand(s.myHand ?? "Diestro");
              setMyStyle(s.myStyle ?? "Agresivo de fondo");
              setMyStrengths(s.myStrengths ?? ["Derecha","Topspin"]);
              setOppHand(s.oppHand ?? "Zurdo");
              setOppStyle(s.oppStyle ?? "Contragolpeador");
              setOppWeak(s.oppWeak ?? ["Revés","Segundo saque"]);
              setSurface(s.surface ?? "Arcilla");
              setObs(s.obs ?? { missBH:0, weak2nd:0, hatesNet:0, strugglesHigh:0, slowMove:0 });
            } catch {}
          }
        }, []);

        useEffect(() => {
          const s = { myHand, myStyle, myStrengths, oppHand, oppStyle, oppWeak, surface, obs };
          localStorage.setItem("coach-tennis-ia", JSON.stringify(s));
        }, [myHand, myStyle, myStrengths, oppHand, oppStyle, oppWeak, surface, obs]);

        const advice = React.useMemo(() => buildAdvice({
          myHand, myStyle, myStrengths, oppHand, oppStyle, oppWeak, surface, obs,
        }), [myHand, myStyle, myStrengths, oppHand, oppStyle, oppWeak, surface, obs]);

        return (
          <div className="mx-auto max-w-6xl space-y-4 p-3 pb-28 safe">
            <header className="sticky top-0 z-10 rounded-2xl bg-gradient-to-r from-gray-900 to-gray-700 p-5 text-white shadow">
              <h1 className="text-xl md:text-2xl font-bold">CoachTennisIA · Demo táctico</h1>
              <p className="mt-1 text-xs md:text-sm opacity-90">Completa tu perfil y el del rival. Marca observaciones en vivo. Recibe un plan táctico.</p>
            </header>

            <div className="grid gap-4 md:grid-cols-2">
              <Section title="Tu perfil">
                <div className="grid gap-3">
                  <Select label="Mano" value={myHand} setValue={setMyHand} options={HANDS} />
                  <Select label="Estilo" value={myStyle} setValue={setMyStyle} options={STYLES} />
                  <div>
                    <div className="mb-1 text-sm text-gray-600">Fortalezas</div>
                    <MultiCheck options={STRENGTHS} values={myStrengths} onChange={setMyStrengths} />
                  </div>
                </div>
              </Section>

              <Section title="Perfil del rival">
                <div className="grid gap-3">
                  <Select label="Mano" value={oppHand} setValue={setOppHand} options={HANDS} />
                  <Select label="Estilo" value={oppStyle} setValue={setOppStyle} options={STYLES} />
                  <div>
                    <div className="mb-1 text-sm text-gray-600">Debilidades</div>
                    <MultiCheck options={WEAKNESSES} values={oppWeak} onChange={setOppWeak} />
                  </div>
                </div>
              </Section>

              <Section title="Contexto del partido">
                <div className="grid gap-3 md:grid-cols-2">
                  <Select label="Superficie" value={surface} setValue={setSurface} options={SURFACES} />
                  <div className="flex flex-wrap items-center gap-2 text-xs text-gray-600">
                    <Tag>{myHand}</Tag>
                    <Tag>{myStyle}</Tag>
                    {myStrengths.map((s) => (<Tag key={s}>{s}</Tag>))}
                  </div>
                </div>
              </Section>
            </div>

            <Section title="Observaciones rápidas (en juego)">
              <div className="grid gap-2 grid-cols-2 md:grid-cols-3">
                <button onClick={() => bump("missBH")} className="rounded-xl border px-3 py-3 text-left active:scale-[0.99] bg-white hover:bg-gray-50">Falla revés · <b>{obs.missBH}</b></button>
                <button onClick={() => bump("weak2nd")} className="rounded-xl border px-3 py-3 text-left active:scale-[0.99] bg-white hover:bg-gray-50">2º saque débil · <b>{obs.weak2nd}</b></button>
                <button onClick={() => bump("hatesNet")} className="rounded-xl border px-3 py-3 text-left active:scale-[0.99] bg-white hover:bg-gray-50">Evita la red · <b>{obs.hatesNet}</b></button>
                <button onClick={() => bump("strugglesHigh")} className="rounded-xl border px-3 py-3 text-left active:scale-[0.99] bg-white hover:bg-gray-50">Sufre bolas altas · <b>{obs.strugglesHigh}</b></button>
                <button onClick={() => bump("slowMove")} className="rounded-xl border px-3 py-3 text-left active:scale-[0.99] bg-white hover:bg-gray-50">Lento de piernas · <b>{obs.slowMove}</b></button>
                <button onClick={resetObs} className="rounded-xl border px-3 py-3 text-center active:scale-[0.99] bg-white hover:bg-gray-50">Reiniciar</button>
              </div>
            </Section>

            <Section title="Plan táctico sugerido">
              <div className="grid gap-4 md:grid-cols-2">
                <div>
                  <h3 className="mb-1 font-semibold">Plan de juego</h3>
                  <ul className="list-disc pl-5 text-sm text-gray-800">{advice.plan.map((p, i) => (<li key={i}>{p}</li>))}</ul>
                </div>
                <div>
                  <h3 className="mb-1 font-semibold">Patrones / jugadas</h3>
                  <ul className="list-disc pl-5 text-sm text-gray-800">{advice.patterns.map((p, i) => (<li key={i}>{p}</li>))}</ul>
                </div>
                <div>
                  <h3 className="mb-1 font-semibold">Saque / devolución</h3>
                  <ul className="list-disc pl-5 text-sm text-gray-800">{advice.serveReturn.map((p, i) => (<li key={i}>{p}</li>))}</ul>
                </div>
                <div>
                  <h3 className="mb-1 font-semibold">Ajustes en partido</h3>
                  <ul className="list-disc pl-5 text-sm text-gray-800">{advice.inMatch.map((p, i) => (<li key={i}>{p}</li>))}</ul>
                </div>
              </div>
            </Section>

            <div className="fixed bottom-0 left-0 right-0 z-20 safe">
              <div className="mx-auto max-w-3xl rounded-t-2xl border bg-white/90 backdrop-blur p-3 grid grid-cols-3 gap-2 shadow-2xl">
                <button onClick={() => bump("missBH")} className="rounded-xl border px-3 py-2 text-sm">Revés -</button>
                <button onClick={() => bump("weak2nd")} className="rounded-xl border px-3 py-2 text-sm">2º saque -</button>
                <button onClick={() => bump("slowMove")} className="rounded-xl border px-3 py-2 text-sm">Lento -</button>
              </div>
            </div>

            <footer className="pb-8 pt-2 text-center text-xs text-gray-500">Demo MVP · No reemplaza a un entrenador. Usa el criterio en cancha 🧠🎾</footer>
          </div>
        );
      }

      function buildAdvice(ctx) {
        const { myHand, myStyle, myStrengths, oppHand, oppStyle, oppWeak, surface, obs } = ctx;
        const plan = []; const patterns = []; const serveReturn = []; const inMatch = [];
        const isLeftyOpp = oppHand === "Zurdo"; const iAmLefty = myHand === "Zurdo";
        const strongFH = myStrengths.includes("Derecha"); const strongBH = myStrengths.includes("Revés");
        const strongTop = myStrengths.includes("Topspin");

        if (surface === "Arcilla") { plan.push("Prioriza consistencia, altura y ángulos: castiga con topspin y profundidad."); if (strongTop) patterns.push("Pelota alta cruzada para empujarlo atrás y abrir paralelos."); }
        if (surface === "Dura") plan.push("Ritmo medio-alto, busca primeros golpes dominantes y cambia direcciones.");
        if (surface === "Césped") plan.push("Pelotas bajas y rápidas: slice efectivo, jugar recto y cerrar en la red.");

        if (oppWeak.includes("Revés")) { plan.push("Cargar el revés del rival en peloteos largos."); if (strongFH) patterns.push("Derecha cruzada al revés, luego derecha paralela a la línea abierta."); else patterns.push("Cruza al revés y cambia al cuerpo para errores forzados."); }
        if (oppWeak.includes("Derecha")) { plan.push("Ataca la derecha del rival cuando esté en carrera o fuera de balance."); patterns.push("Juega al revés para abrir y cambia a su derecha cuando lo muevas."); }
        if (oppWeak.includes("Segundo saque")) serveReturn.push("Adelántate en la devolución del segundo saque y golpea profundo al centro o a su revés.");
        if (oppWeak.includes("Juego en la red")) { plan.push("Mantén pelotas bajas y pasa cuando suba: obligarlo a volear."); patterns.push("Pase cruzado + globo si se acerca demasiado."); }
        if (oppWeak.includes("Movimiento")) plan.push("Muévelo de lado a lado con cambios de dirección y dejadas ocasionales.");
        if (oppWeak.includes("Altas (topspin)")) plan.push("Usa bolas con más altura a su lado débil para sacar errores.");
        if (oppWeak.includes("Bajas (slice)")) plan.push("Castiga con slice bajo y profundo, especialmente short cross.");

        if (myStyle === "Agresivo de fondo" && oppStyle === "Contragolpeador") plan.push("Ataca con paciencia: entra cuando la bola quede corta; evita sobrejugar.");
        if (myStyle === "Contragolpeador" && oppStyle === "Agresivo de fondo") plan.push("Profundidad y cambio de alturas: que pegue en retroceso, roba tiempo.");
        if (myStyle === "Saque y volea") serveReturn.push("Varía direcciones de saque y sube tras primer saque; ocasional tras segundo.");

        if (isLeftyOpp) { plan.push("Recuerda: cruzado de tu derecha va a su revés; cruzado de tu revés va a su derecha."); if (oppWeak.includes("Revés")) patterns.push("Derecha cruzada fuerte (a su revés de zurdo) + paralela cuando abra."); }
        if (iAmLefty && !isLeftyOpp) patterns.push("Abre con slice de saque abierto de zurdo al ancho en iguales; derecha a campo abierto.");

        if (strongFH) plan.push("Construye con tu derecha: inside-out al revés, y define inside-in.");
        if (strongBH) patterns.push("Revés cruzado pesado para dominar diagonales; castiga paralelo cuando lo bloquees.");

        if (obs.missBH >= 3) inMatch.push("Errores de revés: sigue cargando esa diagonal y sube cuando quede corta.");
        if (obs.weak2nd >= 2) inMatch.push("Segundo saque vulnerable: adelántate más y resta profundo.");
        if (obs.hatesNet >= 2) inMatch.push("Si sube a la red, pasa cruzado o globo; evita invitarlo.");
        if (obs.strugglesHigh >= 2) inMatch.push("Sufre bolas altas: aumenta el topspin a su lado débil.");
        if (obs.slowMove >= 2) inMatch.push("Está llegando tarde: usa dejadas y cambios de dirección.");

        serveReturn.push("Primer servicio: altos porcentajes a zonas (T / abierto) según mano del rival.");
        serveReturn.push("Devolución: prioriza profundidad al medio para quitar ángulos; cambia cuando quede corta.");

        const uniq = (arr) => Array.from(new Set(arr.filter(Boolean)));
        return { plan: uniq(plan), patterns: uniq(patterns), serveReturn: uniq(serveReturn), inMatch: uniq(inMatch.length ? inMatch : ["Observa 2-3 puntos: detecta patrón y presiona ahí."]) };
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<CoachTennisIADemo />);
    </script>
  </body>

</html>
