<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>CoachTennisIA · MVP dividido (mejorado)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body { -webkit-tap-highlight-color: transparent; }
      .safe { padding-bottom: constant(safe-area-inset-bottom); padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body class="bg-gray-100">
    <div id="root"></div>

    <!-- SCRIPT PRINCIPAL -->
    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useMemo } = React;

      /* --------------------- Catálogos --------------------- */
      const SURFACES = ["Arcilla", "Dura", "Césped"];
      const STYLES = ["Agresivo de fondo", "Contragolpeador", "Todo-terreno", "Saque y volea"];
      const HANDS = ["Diestro", "Zurdo"];
      const STRENGTHS = ["Derecha", "Revés", "Saque", "Volea", "Físico", "Topspin"];
      const WEAKNESSES = ["Revés", "Derecha", "Movimiento", "Juego en la red", "Segundo saque", "Altas (topspin)", "Bajas (slice)"];
      const WEATHER = ["Templado", "Calor", "Frío", "Viento", "Humedad"];
      const FEELINGS = ["Confiado", "Neutro", "Tenso", "Cansado", "Dolor leve"];
      const SCORE_TRENDS = ["Ganando","Parejo","Perdiendo"];

      /* --------------------- Helpers UI --------------------- */
      const Tag = ({ children }) => (
        <span className="inline-block rounded-full border px-2 py-0.5 text-xs text-gray-700">{children}</span>
      );

      const Section = ({ title, right, children }) => (
        <div className="rounded-2xl border bg-white p-4 shadow-sm">
          <div className="mb-3 flex items-center justify-between gap-2">
            <h2 className="text-lg font-semibold">{title}</h2>
            {right}
          </div>
          {children}
        </div>
      );

      const Select = ({ label, value, setValue, options }) => (
        <label className="flex flex-col gap-1 text-sm">
          <span className="text-gray-600">{label}</span>
          <select
            className="rounded-xl border px-3 py-3"
            value={value}
            onChange={(e)=>setValue(e.target.value)}
          >
            {options.map((o)=><option key={o}>{o}</option>)}
          </select>
        </label>
      );

      const MultiCheck = ({ options, values, onChange }) => (
        <div className="flex flex-wrap gap-2">
          {options.map(opt=>{
            const checked=values.includes(opt);
            return(
              <label key={opt} className={`cursor-pointer rounded-xl border px-3 py-2 text-sm ${checked?"bg-gray-900 text-white":"bg-white"}`}>
                <input type="checkbox" className="mr-2" checked={checked}
                  onChange={(e)=>{
                    if(e.target.checked) onChange([...values,opt]);
                    else onChange(values.filter(v=>v!==opt));
                  }}/>
                {opt}
              </label>
            )
          })}
        </div>
      );

      /* --------------------- LocalStorage --------------------- */
      const saveLS=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
      const loadLS=(k,fb)=>{try{return JSON.parse(localStorage.getItem(k))??fb}catch{return fb}};

      /* --------------------- App principal --------------------- */
      function App(){
        const [tab,setTab]=useState("prep");
        const [myHand,setMyHand]=useState(loadLS("myHand","Diestro"));
        const [myStyle,setMyStyle]=useState(loadLS("myStyle","Agresivo de fondo"));
        const [myStrengths,setMyStrengths]=useState(loadLS("myStrengths",["Derecha"]));
        const [myWeaknesses,setMyWeaknesses]=useState(loadLS("myWeaknesses",["Revés"]));
        const [oppHand,setOppHand]=useState(loadLS("oppHand","Zurdo"));
        const [oppStyle,setOppStyle]=useState(loadLS("oppStyle","Contragolpeador"));
        const [surface,setSurface]=useState(loadLS("surface","Arcilla"));
        const [weather,setWeather]=useState(loadLS("weather","Templado"));
        const [feeling,setFeeling]=useState(loadLS("feeling","Neutro"));
        const [score,setScore]=useState(loadLS("score",{set:1,my:0,opp:0,trend:"Parejo"}));
        const [obs,setObs]=useState(loadLS("obs",{missBH:0,weak2nd:0,hatesNet:0,strugglesHigh:0,slowMove:0}));

        const bump=(k)=>setObs(s=>({...s,[k]:s[k]+1}));
        const resetObs=()=>setObs({missBH:0,weak2nd:0,hatesNet:0,strugglesHigh:0,slowMove:0});

        useEffect(()=>{
          saveLS("myHand",myHand);saveLS("myStyle",myStyle);
          saveLS("myStrengths",myStrengths);saveLS("myWeaknesses",myWeaknesses);
          saveLS("oppHand",oppHand);saveLS("oppStyle",oppStyle);
          saveLS("surface",surface);saveLS("weather",weather);
          saveLS("feeling",feeling);saveLS("score",score);saveLS("obs",obs);
        },[myHand,myStyle,myStrengths,myWeaknesses,oppHand,oppStyle,surface,weather,feeling,score,obs]);

        /* ---------------- Panel cambio de lado ---------------- */
        const [sidePanel,setSidePanel]=useState({visible:false,color:"green",cards:null});
        const triggerSideChange=()=>{
          const plan="Cargar revés + bolas altas";
          const adjust=score.trend==="Ganando"?"Consolida y margen alto":score.trend==="Perdiendo"?"Reset: juega al centro":"Presiona revés rival";
          const mental=feeling==="Cansado"?"Respira profundo y acorta puntos":feeling==="Tenso"?"Rutina 4-4-4 y apunta grande":"Foco: siguiente punto";
          const color=score.trend==="Ganando"?"green":score.trend==="Parejo"?"orange":"red";
          setSidePanel({visible:true,color,cards:{plan,adjust,mental}});
          setTimeout(()=>setSidePanel(s=>({...s,visible:false})),20000);
        };

        /* ---------------- Render ---------------- */
        return(
          <div className="mx-auto max-w-5xl space-y-4 p-3 pb-28 safe">
            <header className="sticky top-0 z-10 rounded-2xl bg-gradient-to-r from-gray-900 to-gray-700 p-5 text-white shadow">
              <div className="flex justify-between items-center">
                <h1 className="text-xl font-bold">CoachTennisIA · MVP dividido</h1>
                <nav className="grid grid-cols-3 gap-2 text-sm">
                  {[
                    {id:"prep",label:"1) Preparación"},
                    {id:"live",label:"2) En partido"},
                    {id:"training",label:"3) Entrenamiento"}
                  ].map(t=>
                    <button key={t.id} onClick={()=>setTab(t.id)} className={`rounded-xl px-3 py-2 ${tab===t.id?"bg-white text-gray-900":"bg-white/10 text-white"}`}>{t.label}</button>
                  )}
                </nav>
              </div>
            </header>

            {/* PREPARTIDO */}
            {tab==="prep"&&(
              <div className="grid gap-4 md:grid-cols-2">
                <Section title="Tu perfil">
                  <Select label="Mano" value={myHand} setValue={setMyHand} options={HANDS}/>
                  <Select label="Estilo" value={myStyle} setValue={setMyStyle} options={STYLES}/>
                  <div><span className="text-sm text-gray-600">Fortalezas</span><MultiCheck options={STRENGTHS} values={myStrengths} onChange={setMyStrengths}/></div>
                  <div><span className="text-sm text-gray-600">Debilidades</span><MultiCheck options={WEAKNESSES} values={myWeaknesses} onChange={setMyWeaknesses}/></div>
                </Section>

                <Section title="Contexto">
                  <Select label="Superficie" value={surface} setValue={setSurface} options={SURFACES}/>
                  <Select label="Clima" value={weather} setValue={setWeather} options={WEATHER}/>
                </Section>
              </div>
            )}

            {/* EN PARTIDO */}
            {tab==="live"&&(
              <div className="grid gap-4 md:grid-cols-2">
                <Section title="Marcador y sensaciones">
                  <div className="flex gap-2 text-sm items-center">
                    <button onClick={()=>setScore(s=>({...s,my:Math.max(0,s.my-1)}))} className="rounded border px-3">-</button>
                    <span>Yo: {score.my}</span>
                    <button onClick={()=>setScore(s=>({...s,my:s.my+1}))} className="rounded border px-3">+</button>
                    <span className="mx-2">/</span>
                    <button onClick={()=>setScore(s=>({...s,opp:Math.max(0,s.opp-1)}))} className="rounded border px-3">-</button>
                    <span>Rival: {score.opp}</span>
                    <button onClick={()=>setScore(s=>({...s,opp:s.opp+1}))} className="rounded border px-3">+</button>
                  </div>
                  <Select label="Tendencia" value={score.trend} setValue={(v)=>setScore(s=>({...s,trend:v}))} options={SCORE_TRENDS}/>
                  <Select label="Sensación" value={feeling} setValue={setFeeling} options={FEELINGS}/>
                  <div className="mt-3">
                    <button onClick={triggerSideChange} className="w-full rounded-2xl bg-gray-900 text-white px-4 py-3 hover:bg-gray-800">Cambio de lado (20s)</button>
                  </div>
                </Section>

                <Section title="Observaciones rápidas">
                  <div className="grid grid-cols-2 gap-2">
                    <button onClick={()=>bump("missBH")} className="rounded border p-3 bg-white">Falla revés · <b>{obs.missBH}</b></button>
                    <button onClick={()=>bump("weak2nd")} className="rounded border p-3 bg-white">2º débil · <b>{obs.weak2nd}</b></button>
                    <button onClick={()=>bump("hatesNet")} className="rounded border p-3 bg-white">Evita red · <b>{obs.hatesNet}</b></button>
                    <button onClick={()=>bump("slowMove")} className="rounded border p-3 bg-white">Lento · <b>{obs.slowMove}</b></button>
                  </div>
                  <button onClick={resetObs} className="mt-3 text-xs underline">Reiniciar</button>
                </Section>
              </div>
            )}

            {/* ENTRENAMIENTO */}
            {tab==="training"&&(
              <Section title="Plan semanal (75–90 min)">
                <ul className="list-disc pl-5 text-sm text-gray-800 space-y-1">
                  <li>Saques (3 spots por lado) — 20’ — meta ≥65% primeros</li>
                  <li>Devolución + Devolución+1 — 20’ — zonas predeterminadas</li>
                  <li>Juegos 0–4 golpes — 20’ — enfoque primeros 4 golpes</li>
                  <li>Simulación clima/altura — 15’ — viento o altura</li>
                  <li>Enfriamiento — 10’ — respiración y movilidad</li>
                </ul>
              </Section>
            )}

            {/* Overlay cambio de lado */}
            {sidePanel.visible&&(
              <div className="fixed inset-0 z-30 flex items-center justify-center bg-black/40 backdrop-blur-sm">
                <div className={`m-4 w-full max-w-xl rounded-2xl p-4 shadow-2xl ${sidePanel.color==="green"?"bg-emerald-50":sidePanel.color==="orange"?"bg-amber-50":"bg-rose-50"}`}>
                  <div className="grid gap-3 text-center">
                    <div className="rounded-xl border bg-white p-4 font-semibold">🧠 PLAN: {sidePanel.cards.plan}</div>
                    <div className="rounded-xl border bg-white p-4 font-semibold">⚙️ AJUSTE: {sidePanel.cards.adjust}</div>
                    <div className="rounded-xl border bg-white p-4 font-semibold">💬 MENTAL: {sidePanel.cards.mental}</div>
                    <p className="text-xs text-gray-500">Se cerrará automáticamente en ~20s</p>
                  </div>
                </div>
              </div>
            )}

            <footer className="pb-8 pt-2 text-center text-xs text-gray-500">
              Demo MVP · No reemplaza a un entrenador. Usa criterio en cancha 🧠🎾
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
